# =============================================================================
# Docker Maintenance - Auto-merge Dependabot PRs
# =============================================================================
# Decides on every Dependabot PR, whatever its ecosystem: a patch update
# merges only after docker-release.yml built the image on the PR (base /
# builder image in src/cloudflared/); everything else stays open with an
# annotation.
# The merge is made with the GITHUB_TOKEN, which starts no push workflow, so
# after a merge this workflow dispatches docker-release.yml on main
# (release-workflow) and waits for it; a release run that does not succeed
# turns this job red. That run:
# 1. Validates compose and builds the image again from the merged main
# 2. Creates a semantic release (fix(docker) -> PATCH) of the tested commit
# 3. Builds and pushes the new Docker image (cloudflared) - only if released
#
# Flow:
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  Dependabot     │────>│  PR Created     │────>│  Docker Build   │
# │  Finds Update   │     │  (base image)   │     │  Validates      │
# └─────────────────┘     └─────────────────┘     └────────┬────────┘
#                                                          │
#                                                          v
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  New Release    │<────│  Auto-Merged    │<────│  All Checks     │
# │  + Docker Push  │     │  to main        │     │  Pass           │
# └─────────────────┘     └─────────────────┘     └─────────────────┘
# =============================================================================

name: "🔧 Docker Maintenance"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter: every Dependabot PR (docker, docker-compose, ...) gets
    # a decision and an annotation instead of silently staying open. Whether
    # it merges is decided by required-workflows below; GitHub Actions updates
    # and changes under .github/ always stay open for review.

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites
  statuses: read        # commit statuses
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image. Its pull_request paths (src/**) cover the base and
      # builder images in src/cloudflared/Dockerfile; a PR outside its paths
      # stays open (not tested).
      required-workflows: '.github/workflows/docker-release.yml'
      # A merge made with the GITHUB_TOKEN starts no push workflow: dispatch
      # the release on main after a merge and fail this job if it does not
      # succeed (release-wait-minutes, default 60).
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
